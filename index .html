// ---- 横向きカエル(図形で描いて自動でふちどり) ----
function mk(gw,gh,draw,pal,s){
  const g=Array.from({length:gh},()=>Array(gw).fill(null));
  const R=(x,y,w,h,c,o)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(j>=0&&j<gh&&i>=0&&i<gw&&(!o||g[j][i]===o))g[j][i]=c};
  const E=(cx,cy,rx,ry,c,o)=>{for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){const a=(i+.5-cx)/rx,b=(j+.5-cy)/ry;if(a*a+b*b<=1&&(!o||g[j][i]===o))g[j][i]=c}};
  const L=(x0,y0,x1,y1,th,c)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;for(let k=0;k<=n;k++)R(Math.round(x0+(x1-x0)*k/n),Math.round(y0+(y1-y0)*k/n),th,th,c)};
  draw(R,E,L,pal);
  const cn=document.createElement('canvas');cn.width=(gw+2)*s;cn.height=(gh+2)*s;const c=cn.getContext('2d');
  for(let j=-1;j<=gh;j++)for(let i=-1;i<=gw;i++){let col=g[j]&&g[j][i];
    if(!col&&[[0,1],[0,-1],[1,0],[-1,0]].some(([a,b])=>g[j+b]&&g[j+b][i+a]))col=pal.K;

  return cn}

function addPad(){

  else if(st==='land'){gap=30+Math.random()*(25+sc*.4);w=Math.round((180+Math.random()*120)/3)*3;type='ground'}

}

  if(frog.air){const s=frogA[k];ctx.translate(x,y-22);ctx.scale(frog.dir,1);ctx.rotate(Math.atan2(frog.vy,Math.max(1,Math.abs(frog.vx)))*.6);ctx.drawImage(s,-s.width/2,-s.height/2)}
  else{const s=frogS[k];let sx=1,sy=1;if(frog.sq){sy=1-.03*frog.sq;sx=1+.03*frog.sq}else if(p>0){sy=1-.2*p;sx=1+.1*p}
    ctx.translate(x,y);ctx.scale(frog.dir,1);ctx.rotate(-.2*p);ctx.drawImage(s,-s.width*sx/2,-s.height*sy,s.width*sx,s.height*sy)}
  ctx.restore();
  if(frog.pw==='gold'){const cy=y-22;ctx.globalAlpha=.15;ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(x,cy,42,0,7);ctx.fill();ctx.globalAlpha=.6+.3*Math.sin(t*.15);ctx.strokeStyle='#ffd23d';ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1}}
function draw(){
  if(state==='end'){drawEnding();return}
  const C=Math.round(cam/3)*3;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,GH);ctx.clip();
  drawBG(C,bgSt);
  for(const p of pads){if(p.type==='pad')drawPad(p,C);else if(p.type==='ground')drawGround(p,C);else if(p.type==='heal')drawHeal(p,C);else drawMush(p,C)}
  if(state==='play'&&drag&&!frog.air){const v=aim();if(v.p>.1){const pts=sim(v.vx,v.vy,frog.x,frog.y-20,140,grav());ctx.fillStyle='#fff';
    for(let i=2;i<pts.length;i+=3){if(pts[i][1]>frog.y&&i>4){ctx.fillStyle='#fff';ctx.fillRect(Math.round((pts[i][0]-C)/3)*3-9,Math.round(pts[i][1]/3)*3,18,3);break}
      ctx.fillRect(Math.round((pts[i][0]-C)/3)*3,Math.round(pts[i][1]/3)*3,3,3)}}}
  for(const f of flies){if(f.got)continue;const sx=f.x-C;if(sx<-30||sx>W+30)continue;
    const fx=Math.round((sx+Math.sin(t*.07+f.ph)*8)/3)*3,fy=Math.round((f.y+Math.cos(t*.09+f.ph)*5)/3)*3;
    ctx.drawImage(flyS[f.k],fx-10,fy-7);
    if(f.k!=='n'&&(t>>3&1)){ctx.fillStyle='#fff';ctx.fillRect(fx+12,fy-9,3,3);ctx.fillRect(fx-14,fy+6,3,3)}}
  for(const s of snakes)drawSnake(s,C);
  drawBoss(C);
  drawFrog(C);
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.l/15);ctx.fillStyle=p.c;ctx.fillRect(Math.round((p.x-C)/3)*3,Math.round(p.y/3)*3,3,3)}ctx.globalAlpha=1;
  for(const r of ripples){ctx.globalAlpha=1-r.l/20;ctx.fillStyle='#cfe6ff';const rr=3+r.l*.6;ctx.fillRect(Math.round((r.x-rr)/3)*3,Math.round(r.y/3)*3,Math.round(rr*2/3)*3,3)}ctx.globalAlpha=1;
  ctx.fillStyle='#d6eaff';ctx.globalAlpha=.7;for(const d of drops){const x=Math.round(d.x/3)*3,y=Math.round(d.y/3)*3;ctx.fillRect(x,y,3,6);ctx.fillRect(x-3,y+6,3,6)}ctx.globalAlpha=1;
  if(t%420<5){ctx.fillStyle='#fff';ctx.globalAlpha=.3;ctx.fillRect(0,0,W,GH);ctx.globalAlpha=1}
  if(fade>0){ctx.fillStyle='#fff';ctx.globalAlpha=fade/25*.8;ctx.fillRect(0,0,W,GH);ctx.globalAlpha=1}
  for(const q of pops)txt(q.s,Math.max(80,Math.min(W-80,q.x-C)),q.y,15,'#e0a800');
  if(state==='play'&&snakes.some(s=>s.x>cam+W-30)&&(t>>3&1))txt('へび！',W-34,WY-50,18,'#e03a3a');
  ctx.restore();
  // パネル
  ctx.fillStyle='#d8f0e0';ctx.fillRect(0,GH,W,H-GH);ctx.fillStyle='#5fd35f';ctx.fillRect(0,GH,W,6);ctx.fillStyle='#fff';ctx.fillRect(0,GH+6,W,3);
  const p=power(),nB=Math.ceil(p*10-.001);txt('パワー',30,346,14,'#2f8f4a','left');
  for(let i=0;i<10;i++)pr(30+i*30,360,27,30,i<nB?(i<5?'#ffe14d':'#ff9870'):'#fff',i<nB?'#a8452f':'#b5d6c0',3);
  const can=!frog.air&&state==='play';
  txt(frog.air&&state==='play'?'ぴょーん！':(drag?'はなして ジャンプ！':(can?'ひっぱった はんたいに ジャンプ！':'')),W/2,420,15,'#2f8f4a');
  txt(can&&!drag?(boss&&boss.active&&boss.hp>0?'クモの うえに おちて ふんづけろ！ (ひだりにも とべる)':'きん=バリア あお=ハエ2ばい ピンク=ライフ+1'):'',W/2,446,12,'#3f7f9a');
  pr(6,6,112,28,'#fff','#5fd35f');txt('ベスト '+best+'ひき',14,21,15,'#2f8f4a','left','rgba(0,0,0,0)');
  pr(W-118,6,112,28,'#fff','#3f7f9a');txt('ハエ '+got+'ひき',W-110,21,15,'#2a5c78','left','rgba(0,0,0,0)');BTN.forEach(drawBtn);
  if(state==='play'){for(let i=0;i<lives;i++)ctx.drawImage(heart,8+i*24,42);
    if(boss&&boss.active&&boss.hp>0){txt('おおグモ',W/2,52,13,'#6a3a9a');for(let i=0;i<5;i++){ctx.fillStyle=i<boss.hp?'#e03a5a':'#d8c8e0';ctx.fillRect(W/2-45+i*18,62,15,9)}}
    if(frog.pw)txt(frog.pw==='gold'?'バリア ON':'ハエ2ばい あと'+frog.pwL+'かい',W-8,52,14,frog.pw==='gold'?'#a87800':'#2a5c78','right')}
  if(state==='play'&&ban){ctx.globalAlpha=Math.min(1,ban.l/20);pr(40,76,280,58,'#fff','#5fd35f',6);
    txt('ステージ '+ban.n+'  '+ban.s.name,W/2,97,17,'#2f8f4a');txt(ban.s.sub,W/2,119,13,'#2a5c78');ctx.globalAlpha=1}
  if(state==='title'){pr(30,34,300,215,'#fff','#5fd35f',6);
    txt('あめのなかの',W/2,66,22,'#2f8f4a');txt('カエルジャンプ',W/2,102,30,'#3fae58');
    txt('ひっぱって はなすと',W/2,142,13,'#2a5c78');txt('ひっぱった はんたいへ とぶ！ (みぎも ひだりも)',W/2,162,14,'#2a5c78');
    txt('いけ → りくち → もり → ボス！',W/2,184,14,'#2a5c78');txt('ハエを あつめて ライフは 3こ',W/2,204,13,'#2a5c78');
    txt((t>>5&1)?'タップで スタート':'',W/2,232,18,'#2f8f4a')}
  if(state==='over'){pr(30,34,300,200,'#fff','#5fd35f',6);
    txt(overMsg,W/2,72,26,'#3f7f9a');txt('つかまえた ハエ',W/2,114,16,'#2a5c78');txt(got+'ひき',W/2,154,34,'#3fae58');
    txt(newRec?'★ しんきろく！ ★':'ベスト '+best+'ひき',W/2,194,16,'#2a5c78');
    txt((t-overT>30&&(t>>5&1))?'タップで もういちど':'',W/2,218,17,'#2f8f4a')}
}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
